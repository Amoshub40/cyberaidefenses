<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Pricing | Cyberaidefenses</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
        .tier-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 40px; display: flex; flex-direction: column; transition: transform 0.3s ease; position: relative; }
        .tier-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .tier-card.featured { border: 2px solid #38bdf8; }
        .badge { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: #38bdf8; color: #0f172a; padding: 4px 16px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .price { font-size: 3rem; font-weight: 700; color: #ffffff; margin: 20px 0; }
        .price span { font-size: 1rem; color: #9ca3af; font-weight: 400; }
        .features { list-style: none; padding: 0; margin: 30px 0; flex-grow: 1; }
        .features li { color: #9ca3af; margin-bottom: 12px; display: flex; align-items: center; font-size: 0.95rem; }
        .features li::before { content: "✓"; color: #38bdf8; margin-right: 10px; font-weight: bold; }
        .cta-button { background: #38bdf8; color: #0f172a; text-align: center; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s; border: none; cursor: pointer; }
        .cta-button:hover { background: #ffffff; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">CYBERAIDEFENSES.COM</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="solutions.html">Solutions</a></li>
                <li><a href="platform.html">Platform</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html" class="nav-cta">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <header class="container" style="text-align: center; padding: 100px 40px; background: #0a0b10;">
        <h1 style="font-size: 3.5rem; color: #ffffff; letter-spacing: -0.02em;">Strategic Tiering</h1>
        <p style="color: #9ca3af; font-size: 1.2rem;">Select the defense posture appropriate for your current risk surface.</p>
    </header>

    <div class="pricing-grid">
    <div class="tier-card">
        <h3>Foundation</h3>
        <div class="price">$99<span>/mo</span></div>
        <a href="PASTE_FOUNDATION_LINK_HERE" class="cta-button">Buy Now</a>
    </div>

    <div class="tier-card featured">
        <div class="badge">Recommended</div>
        <h3>Growth & Resilience</h3>
        <div class="price">$499<span>/mo</span></div>
        <a href="PASTE_GROWTH_LINK_HERE" class="cta-button">Buy Now</a>
    </div>

    <div class="tier-card">
        <h3>Strategic Governance</h3>
        <div class="price">$1,500<span>/mo</span></div>
        <a href="PASTE_GOVERNANCE_LINK_HERE" class="cta-button">Buy Now</a>
    </div>
</div>
</body>
</html>
