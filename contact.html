<body style="background-color: #0a0b10; color: #ffffff; font-family: sans-serif; margin: 0;">
    <nav style="padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937;">
        <div style="font-weight: bold; letter-spacing: 1px;">
            <a href="index.html" style="color: #ffffff; text-decoration: none;">CYBERAIDEFENSES.COM</a>
        </div>
        <div style="display: flex; gap: 30px; align-items: center;">
            <a href="index.html" style="color: #9ca3af; text-decoration: none; font-size: 0.9rem;">Home</a>
            <a href="solutions.html" style="color: #9ca3af; text-decoration: none; font-size: 0.9rem;">Solutions</a>
            <a href="platform.html" style="color: #9ca3af; text-decoration: none; font-size: 0.9rem;">Platform</a>
            <a href="trust.html" style="color: #9ca3af; text-decoration: none; font-size: 0.9rem;">Trust Center</a>
            <a href="pricing.html" style="color: #9ca3af; text-decoration: none; font-size: 0.9rem;">Pricing</a>

        </div>
    </nav>

    <main style="max-width: 1200px; margin: 80px auto; padding: 0 20px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px;">
            
            <div style="background: #111827; padding: 40px; border-radius: 12px; border: 1px solid #1f2937;">
                <h2 style="color: #ffffff; margin-bottom: 30px;">Direct Channels</h2>
                <p style="color: #38bdf8; font-weight: bold;">amos@cyberaidefenses.com</p>
                <p style="color: #ffffff;">720-355-5699</p>
                <p style="color: #9ca3af; margin-top: 20px;">1312 17th Street, Suite #230<br>Denver, CO 80202</p>
            </div>

            
<form action="mailto:amos@cyberaidefenses.com" method="post" enctype="text/plain" style="background: #111827; padding: 40px; border-radius: 12px; border: 1px solid #1f2937; max-width: 600px; margin: 0 auto;">
    <h2 style="color: #ffffff; margin-bottom: 20px; font-family: 'Inter', sans-serif;">Secure Inquiry</h2>
    
    <div style="margin-bottom: 20px;">
        <input type="text" name="Name" placeholder="Full Name" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 20px;">
        <input type="email" name="Email" placeholder="Work Email" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 25px;">
        <textarea name="Message" placeholder="How can we help you?" rows="4" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;"></textarea>
    </div>
    
    <button type="submit" style="width: 100%; padding: 18px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; text-transform: uppercase; font-family: 'Inter', sans-serif;">Send Direct Email</button>
</form>
        </div>
    </main>
