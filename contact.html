<div id="form-container">
    <form action="mailto:amos@cyberaidefenses.com" method="post" enctype="text/plain" onsubmit="showSuccess()" style="background: #111827; padding: 40px; border-radius: 12px; border: 1px solid #1f2937; max-width: 600px; margin: 0 auto;">
        <h2 style="color: #ffffff; margin-bottom: 20px; font-family: 'Inter', sans-serif;">Secure Inquiry</h2>
        
        <div style="margin-bottom: 20px;">
            <input type="text" name="Name" placeholder="Full Name" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 20px;">
            <input type="text" name="Company" placeholder="Company Name" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <input type="email" name="Email" placeholder="Work Email" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 20px;">
            <select name="Environment" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #9ca3af; box-sizing: border-box; appearance: none; cursor: pointer;">
                <option value="" disabled selected>Select Infrastructure Environment</option>
                <option value="AWS">Amazon Web Services (AWS)</option>
                <option value="Azure">Microsoft Azure</option>
                <option value="GCP">Google Cloud Platform (GCP)</option>
                <option value="Hybrid">Hybrid / On-Premise</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div style="margin-bottom: 25px;">
            <textarea name="Message" placeholder="How can we help you?" rows="4" required style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;"></textarea>
        </div>
        
        <button type="submit" style="width: 100%; padding: 18px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; text-transform: uppercase; font-family: 'Inter', sans-serif;">Send Direct Email</button>
    </form>
</div>

<div id="success-message" style="display: none; background: #111827; padding: 60px 40px; border-radius: 12px; border: 1px solid #38bdf8; max-width: 600px; margin: 0 auto; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 20px;">✅</div>
    <h2 style="color: #ffffff; margin-bottom: 10px;">Inquiry Initiated</h2>
    <p style="color: #9ca3af; line-height: 1.6;">Your email application has been opened. Please click 'Send' in your mail app to complete the request.</p>
    <button onclick="location.reload()" style="margin-top: 20px; background: transparent; border: 1px solid #1f2937; color: #38bdf8; padding: 10px 20px; border-radius: 6px; cursor: pointer;">Send Another</button>
</div>

<script>
    function showSuccess() {
        // Delay the visual change slightly so the mailto: link has time to trigger
        setTimeout(function() {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
        }, 500);
    }
</script>
